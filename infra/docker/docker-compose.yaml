services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vertico-db
    environment:
      POSTGRES_DB: vertico
      POSTGRES_USER: tom
      POSTGRES_PASSWORD: vertoco123
    ports:
      - "5432:5432"
    volumes:
      - vertico_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tom"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    container_name: vertico-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tom:vertoco123@db:5432/vertico
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../:/app       

volumes:
  vertico_db_data:



  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/worker.Dockerfile
    container_name: copilot-worker
    environment:
      DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../:/app