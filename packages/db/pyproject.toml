[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertico-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sqlmodel", "psycopg2-binary", "alembic", "pgvector"]

[tool.setuptools]
packages = ["db", "db.models", "db.repositories", "db.vector"]
include-package-data = true

[tool.setuptools.package-dir]
db = "."
"db.models" = "models"
"db.repositories" = "repositories"
"db.vector" = "vector"
