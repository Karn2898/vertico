[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertico-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai", "pgvector", "sqlmodel", "gitpython", "tree-sitter", "tiktoken"]

[tool.setuptools]
packages = ["chunker", "embedder", "indexers", "rerankers", "Retrievers"]
include-package-data = true