name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
     - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-mock
          pip install -e packages/db
          pip install -e packages/rag
          pip install -e packages/sandbox
          pip install -e packages/agent-core
          pip install -e apps/api

         - name: Run tests
        run: pytest tests/unit/ -v --tb=short

      - name: Lint
        run: |
          pip install ruff
          ruff check packages/ apps/

     build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


       - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vertico/api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/vertico/api:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vertico/worker:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/vertico/worker:latest


deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/copilot-agent
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f infra/deploy/docker-compose.prod.yml pull
            docker compose -f infra/deploy/docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f  